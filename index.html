<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Random Schweizer Wanderung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS – ohne SRI, damit es auch in restriktiven Umgebungen lädt -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: calc(100% - 60px); }
    #info {
      padding: 10px;
      font-family: system-ui, sans-serif;
      background: #ffffffcc;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background: #0d47a1;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #08306b; }
  </style>
</head>
<body>
  <div id="info">
    <span id="stats">Lade Wanderung …</span>
    <button id="newBtn">Neue Wanderung</button>
  </div>
  <div id="map"></div>

  <!-- Leaflet JS – ohne SRI -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Prüfen, ob Leaflet korrekt geladen wurde
    if (typeof L === 'undefined') {
      alert('Leaflet konnte nicht geladen werden. Bitte überprüfe deine Internetverbindung oder die CDN‑URL.');
    }

    /*
      === KONFIGURATION ===
      Trage hier deinen persönlichen OpenRouteService‑API‑Schluessel ein.
      Kostenlose Registrierung: https://openrouteservice.org/
    */
    const ORS_API_KEY = "5b3ce3597851110001cf62481fb64867c6f144b29e9fa443894a113a";

    // Schweizer Bounding Box (Lat/Lon)
    const SWISS_BOUNDS = {
      minLat: 45.8,
      maxLat: 47.8,
      minLon: 5.96,
      maxLon: 10.49
    };

    // Wunschlänge der Route (in km)
    const TARGET_MIN_KM = 6;
    const TARGET_MAX_KM = 18;

    // Leaflet‑Karte initialisieren (EPSG:3857)
    const map = L.map('map', {
      crs: L.CRS.EPSG3857,
      attributionControl: false
    });

    // Swisstopo‑Basiskarte als WMTS‑Layer (Pixelkarte Farbe)
    const swisstopo = L.tileLayer(
      'https://wmts20.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
      {
        maxZoom: 17,
        attribution: '© <a href="https://www.swisstopo.ch/">swisstopo</a>'
      }
    ).addTo(map);

    let routeLayer;

    // Beim Klick auf den Button eine neue Wanderung generieren
    document.getElementById('newBtn').addEventListener('click', generateRandomHike);

    // Direkt beim Start loslegen
    generateRandomHike();

    /* ========= FUNKTIONEN ========= */

    async function generateRandomHike() {
      updateStatus('Generiere Wanderung …');
      if (routeLayer) routeLayer.remove();

      for (let i = 0; i < 15; i++) { // Maximal 15 Versuche
        const [start, end] = randomStartEnd();
        try {
          const data = await fetchRoute(start, end);
          const summary = data.features[0].properties.summary;
          const distKm = summary.distance / 1000;

          // Nur akzeptieren, wenn innerhalb des Zielbereichs
          if (distKm < TARGET_MIN_KM || distKm > TARGET_MAX_KM) continue;

          const durationH = summary.duration / 3600;
          const ascent = summary.ascent ?? 0;   // Fallback, falls API diese Felder nicht liefert
          const descent = summary.descent ?? 0;

          const lineCoords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
          routeLayer = L.polyline(lineCoords, { color: 'red', weight: 4 }).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

          updateStatus(`Distanz ${distKm.toFixed(1)} km | Dauer ≈ ${durationH.toFixed(1)} h`);
          return; // Erfolg
        } catch (err) {
          console.warn('Routing‑Fehler, versuche erneut …', err);
        }
      }
      updateStatus('Keine passende Wanderung gefunden – bitte erneut versuchen.');
    }

    function updateStatus(text) {
      document.getElementById('stats').textContent = text;
    }

    /*
      Liefert einen zufälligen Start‑ und Zielpunkt innerhalb der Schweiz.
      Der Zielpunkt wird über Zufallsrichtung + Distanz bestimmt.
    */
    function randomStartEnd() {
      const lat = randBetween(SWISS_BOUNDS.minLat, SWISS_BOUNDS.maxLat);
      const lon = randBetween(SWISS_BOUNDS.minLon, SWISS_BOUNDS.maxLon);
      const bearing = Math.random() * 360; // Grad
      const distance = randBetween(TARGET_MIN_KM * 0.6, TARGET_MAX_KM * 0.8) * 1000; // Meter
      const dest = destinationPoint(lat, lon, bearing, distance);

      // Sicherstellen, dass Zielpunkt ebenfalls in CH liegt
      if (dest[0] < SWISS_BOUNDS.minLat || dest[0] > SWISS_BOUNDS.maxLat ||
          dest[1] < SWISS_BOUNDS.minLon || dest[1] > SWISS_BOUNDS.maxLon) {
        return randomStartEnd(); // rekursiv neu versuchen
      }
      return [[lat, lon], dest];
    }

    function randBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    /*
      Berechnet einen Punkt, der von lat/lon aus in bearing‑Richtung
      (in Grad) um distance Meter entfernt liegt (vereinfachte Formel).
    */
    function destinationPoint(lat, lon, bearingDeg, distanceM) {
      const R = 6371e3; // Erd‑Radius
      const bearing = bearingDeg * Math.PI / 180;
      const lat1 = lat * Math.PI / 180;
      const lon1 = lon * Math.PI / 180;

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distanceM / R) +
                              Math.cos(lat1) * Math.sin(distanceM / R) * Math.cos(bearing));
      const lon2 = lon1 + Math.atan2(Math.sin(bearing) * Math.sin(distanceM / R) * Math.cos(lat1),
                                     Math.cos(distanceM / R) - Math.sin(lat1) * Math.sin(lat2));
      return [lat2 * 180 / Math.PI, ((lon2 * 180 / Math.PI) + 540) % 360 - 180]; // Normalisiert
    }

    /*
      Ruft die Directions‑API von OpenRouteService ab (Profil: foot‑hiking).
      Gibt GeoJSON mit Geometrie und Statistik zurueck.
    */
    async function fetchRoute(startLatLon, endLatLon) {
      const url = 'https://api.openrouteservice.org/v2/directions/foot-hiking/geojson';
      const body = {
        coordinates: [
          [startLatLon[1], startLatLon[0]], // [lon, lat]
          [endLatLon[1],   endLatLon[0]]
        ],
        elevation: true,
        preference: 'recommended'
      };
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': ORS_API_KEY
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`ORS‑Fehler ${res.status}`);
      return res.json();
    }
  </script>
</body>
</html>
