<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zufallspunkt in der Schweiz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 80vh; width: 100%; }
    body { font-family: sans-serif; text-align: center; padding: 1em; }
    button { padding: 0.5em 1em; margin-bottom: 1em; font-size: 1em; }
  </style>
</head>
<body>
  <button onclick="showRandomPoint()">Zufallspunkt anzeigen</button>
  <div id="location"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([46.8, 8.3], 8); // Schweiz-Zentrum

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap-Mitwirkende'
    }).addTo(map);

    let marker;

    async function showRandomPoint() {
      let inSwitzerland = false;
      let lat, lon, locationName;

      while (!inSwitzerland) {
        lat = 45.8 + Math.random() * (47.8 - 45.8);
        lon = 5.9 + Math.random() * (10.5 - 5.9);

        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=de`);
        const data = await res.json();

        if (data.address && data.address.country_code === 'ch') {
          inSwitzerland = true;
          locationName = data.display_name;
        }
      }

      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lon]).addTo(map);
      map.setView([lat, lon], 13);
      document.getElementById('location').textContent = `Ort: ${locationName}`;
    }

    // Zeige beim Start direkt einen Punkt
    showRandomPoint();
  </script>
</body>
</html>
